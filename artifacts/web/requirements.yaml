packages:
  "framer-motion": "For page transitions, smooth list reveals, and micro-interactions"
  "date-fns": "For formatting dates in the booking form"
  "clsx": "For conditional tailwind class merging"
  "tailwind-merge": "For safely merging tailwind classes in components"
  "lucide-react": "For beautiful consistent iconography across the app"

notes:
  - Assuming Orval hooks are correctly exported from @workspace/api-client-react.
  - The app heavily relies on React Context for local cart state since cart is not persisted on the backend until checkout.
  - Using standard HTML forms styled with Tailwind to ensure maximum compatibility and beautiful custom design without relying on potentially incomplete shadcn setups.
